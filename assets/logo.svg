<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="logo-grad-primary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="logo-grad-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Outer Orbit Ring -->
  <circle cx="50" cy="50" r="42" stroke="url(#logo-grad-primary)" stroke-width="3.5" stroke-dasharray="6 4" opacity="0.4" />
  
  <!-- Geometric Compass Arrow / Navigation Vector Mark -->
  <path d="M50 14 L78 72 L50 58 L22 72 Z" fill="url(#logo-grad-primary)" />
  
  <!-- Inner AI Neural Core Diamond -->
  <polygon points="50,32 59,48 50,64 41,48" fill="#FFFFFF" opacity="0.9" />
  
  <!-- Central AI Pulse Node -->
  <circle cx="50" cy="48" r="5" fill="#06B6D4" />
</svg>
